
# Catppuccin Mocha lock screen

general {
    hide_cursor = true
}

background {
    monitor =
    color = rgb(17, 17, 27)
}

label {
    monitor =
    text = cmd[update:1000] date +"%H:%M"
    color = rgb(205, 214, 244)
    font_size = 82
    font_family = JetBrainsMono Nerd Font
    position = 0, 140
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] date +"%A, %B %d"
    color = rgb(137, 180, 250)
    font_size = 20
    font_family = JetBrainsMono Nerd Font
    position = 0, 55
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 300, 55
    outline_thickness = 2

    dots_size = 0.2
    dots_spacing = 0.25
    dots_center = true

    outer_color = rgb(137, 180, 250)
    inner_color = rgb(30, 30, 46)
    font_color = rgb(205, 214, 244)

    fade_on_empty = false
    placeholder_text = Enter password...

    position = 0, -90
    halign = center
    valign = center
}
